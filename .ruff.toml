# Configuración de ruff estilo OCA (rama 18.0). Python de la imagen odoo:18.0 = 3.12;
# se mantiene py310 como mínimo soportado por Odoo 18.
target-version = "py310"
fix = true

[lint]
extend-select = [
    "B",
    "C90",
    "E501",  # línea demasiado larga (88)
    "I",     # isort
    "UP",    # pyupgrade
]
extend-safe-fixes = ["UP008"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"__manifest__.py" = ["B018"]

[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16
